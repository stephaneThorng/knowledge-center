name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet (dates de modification)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quartz/package-lock.json

      # Assemble le contenu du site : TOUT ce qui est dans docs/ est publie
      # (page d'accueil + un dossier par domaine, detection automatique).
      - name: Prepare content
        run: |
          set -euo pipefail
          CONTENT="quartz/content"
          EXCLUDE=(.obsidian .git private templates)

          rm -rf "$CONTENT"
          mkdir -p "$CONTENT"

          shopt -s dotglob nullglob
          for f in docs/*; do
            name="$(basename "$f")"
            skip=0
            for x in "${EXCLUDE[@]}"; do [[ "$name" == "$x" ]] && skip=1; done
            if [[ $skip -eq 1 ]]; then
              echo "  exclu    : $name"
              continue
            fi
            cp -r "$f" "$CONTENT/"
            echo "  publie   : $name"
          done

          echo "----------------------------------------"
          echo "Fichiers Markdown publies : $(find "$CONTENT" -name '*.md' | wc -l)"

      - name: Install dependencies
        working-directory: quartz
        run: npm ci

      - name: Build site
        working-directory: quartz
        # On appelle node explicitement : le bit executable n'est pas
        # conserve par Git, donc "npx quartz" echouerait sous Linux.
        run: node ./quartz/bootstrap-cli.mjs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
